<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test CORS - Backend CIES</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
            background: #0f766e;
            color: #333;
        }
        
        .container {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        h1 {
            color: #0f766e;
            border-bottom: 3px solid #0f766e;
            padding-bottom: 10px;
        }
        
        .section {
            margin-bottom: 30px;
        }
        
        .section h2 {
            font-size: 18px;
            color: #0f766e;
            margin-top: 0;
        }
        
        .info-box {
            background: #f0f9ff;
            border-left: 4px solid #0f766e;
            padding: 15px;
            margin: 10px 0;
            border-radius: 4px;
            font-family: monospace;
            font-size: 14px;
        }
        
        .buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 20px 0;
        }
        
        button {
            background: #0f766e;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }
        
        button:hover {
            background: #0d6b63;
        }
        
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .result {
            background: #f5f5f5;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 15px;
            margin: 10px 0;
            font-family: monospace;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
        
        .success {
            background: #f0fdf4;
            border-color: #86efac;
            color: #166534;
        }
        
        .error {
            background: #fef2f2;
            border-color: #fecaca;
            color: #991b1b;
        }
        
        .warning {
            background: #fffbeb;
            border-color: #fcd34d;
            color: #92400e;
        }
        
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #0f766e;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin: 0 5px 0 0;
        }
        
        .badge.success {
            background: #dcfce7;
            color: #166534;
        }
        
        .badge.error {
            background: #fee2e2;
            color: #991b1b;
        }
        
        .badge.pending {
            background: #e0e7ff;
            color: #3730a3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Test de CORS - Backend CIES</h1>
        
        <div class="section">
            <h2>Información de Tu Navegador</h2>
            <div id="browserInfo" class="info-box"></div>
        </div>
        
        <div class="section">
            <h2>Tests Disponibles</h2>
            
            <div class="buttons">
                <button onclick="testPing()">
                    <span id="ping-spinner"></span> Test Ping
                </button>
                <button onclick="testHealth()">
                    <span id="health-spinner"></span> Test Health
                </button>
                <button onclick="testCorsTest()">
                    <span id="cors-test-spinner"></span> Test CORS Preflight
                </button>
                <button onclick="testLogin()">
                    <span id="login-spinner"></span> Test Login (POST)
                </button>
                <button onclick="clearResults()">Limpiar Resultados</button>
            </div>
        </div>
        
        <div class="section">
            <h2>Resultados</h2>
            <div id="results"></div>
        </div>
        
        <div class="section">
            <h2>Información de Configuración</h2>
            <div id="config" class="info-box"></div>
        </div>
    </div>

    <script>
        const BACKEND_URL = 'https://encuestas-back-production.up.railway.app';
        
        function showSpinner(id) {
            const elem = document.getElementById(id);
            elem.innerHTML = '<span class="spinner"></span>';
        }
        
        function hideSpinner(id) {
            const elem = document.getElementById(id);
            elem.innerHTML = '';
        }
        
        function addResult(title, status, content) {
            const resultsDiv = document.getElementById('results');
            const resultDiv = document.createElement('div');
            resultDiv.className = `result ${status}`;
            
            const timestamp = new Date().toLocaleTimeString();
            const badge = `<span class="badge ${status}">${status.toUpperCase()}</span>`;
            
            resultDiv.innerHTML = `<strong>${badge} ${title}</strong> [${timestamp}]\n\n${JSON.stringify(content, null, 2)}`;
            resultsDiv.appendChild(resultDiv);
        }
        
        function clearResults() {
            document.getElementById('results').innerHTML = '';
        }
        
        async function testPing() {
            showSpinner('ping-spinner');
            try {
                const response = await fetch(`${BACKEND_URL}/ping`);
                const data = await response.json();
                hideSpinner('ping-spinner');
                addResult('PING', response.ok ? 'success' : 'error', {
                    status: response.status,
                    data
                });
            } catch (err) {
                hideSpinner('ping-spinner');
                addResult('PING', 'error', {
                    error: err.message,
                    type: err.name
                });
            }
        }
        
        async function testHealth() {
            showSpinner('health-spinner');
            try {
                const response = await fetch(`${BACKEND_URL}/health`);
                const data = await response.json();
                hideSpinner('health-spinner');
                addResult('HEALTH', response.ok ? 'success' : 'error', {
                    status: response.status,
                    data
                });
            } catch (err) {
                hideSpinner('health-spinner');
                addResult('HEALTH', 'error', {
                    error: err.message,
                    type: err.name
                });
            }
        }
        
        async function testCorsTest() {
            showSpinner('cors-test-spinner');
            const origin = window.location.origin;
            
            try {
                // Test preflight
                const preflightResponse = await fetch(`${BACKEND_URL}/cors-test/preflight-info`, {
                    method: 'OPTIONS',
                    headers: {
                        'Access-Control-Request-Method': 'POST',
                        'Access-Control-Request-Headers': 'Content-Type'
                    }
                });
                
                // Test POST
                const postResponse = await fetch(`${BACKEND_URL}/cors-test/test-login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: 'test@test.com',
                        password: 'test'
                    })
                });
                
                const postData = await postResponse.json();
                hideSpinner('cors-test-spinner');
                
                addResult('CORS TEST', postResponse.ok ? 'success' : 'error', {
                    origin,
                    preflightStatusCode: preflightResponse.status,
                    postStatusCode: postResponse.status,
                    response: postData
                });
            } catch (err) {
                hideSpinner('cors-test-spinner');
                addResult('CORS TEST', 'error', {
                    error: err.message,
                    type: err.name,
                    possibleCause: 'CORS bloqueado - verify ALLOWED_ORIGINS in backend'
                });
            }
        }
        
        async function testLogin() {
            showSpinner('login-spinner');
            try {
                const response = await fetch(`${BACKEND_URL}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: 'antelo123@hotmail.com',
                        password: '123456'
                    })
                });
                
                const data = await response.json();
                hideSpinner('login-spinner');
                
                addResult('LOGIN TEST', response.ok ? 'success' : 'warning', {
                    status: response.status,
                    statusText: response.statusText,
                    response: data
                });
            } catch (err) {
                hideSpinner('login-spinner');
                addResult('LOGIN TEST', 'error', {
                    error: err.message,
                    type: err.name
                });
            }
        }
        
        function updateInfo() {
            const browserInfo = {
                'URL Actual': window.location.href,
                'Origen': window.location.origin,
                'Hostname': window.location.hostname,
                'Protocolo': window.location.protocol,
                'UserAgent': navigator.userAgent.substring(0, 50) + '...'
            };
            
            document.getElementById('browserInfo').textContent = JSON.stringify(browserInfo, null, 2);
            
            const config = {
                'Backend URL': BACKEND_URL,
                'Tu Origen': window.location.origin,
                'Debe estar en ALLOWED_ORIGINS': window.location.origin
            };
            
            document.getElementById('config').textContent = JSON.stringify(config, null, 2);
        }
        
        // Ejecutar al cargar
        updateInfo();
    </script>
</body>
</html>
